services:
  site:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    restart: unless-stopped
    environment:
      IS_ALLOY: ${IS_ALLOY:-false}
      # Vite needs an explicit poll-based watcher on bind-mounted volumes.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/workspace
      - dafe_node_modules:/workspace/node_modules
    command: >
      bash -lc "npm install --no-audit --no-fund &&
                npm run dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5173/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  dafe_node_modules:
